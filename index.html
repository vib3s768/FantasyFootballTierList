<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tier Sheet: fantasy football tier lists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8ebee;--panel:#fff;--ink:#12171d;--mute:#6b7480;--line:#d3d8de;--turf:#1d6b46;--turf2:#175738;--cw:128px;--ch:172px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.4 Barlow,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
header{background:var(--ink);color:#fff;padding:14px 24px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 32px}
.brand{font:700 30px/1 'Barlow Condensed';letter-spacing:.01em;padding-bottom:12px}
.brand small{display:block;font:400 13px Barlow;color:#9aa4b0;margin-top:4px;letter-spacing:0}
nav{display:flex;gap:4px;flex:1}
nav button{background:none;border:0;border-bottom:3px solid transparent;color:#9aa4b0;font:600 22px 'Barlow Condensed';padding:10px 18px 9px;transition:color .15s,border-color .15s}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-color:#3fbf84}
.acts{display:flex;gap:8px;padding-bottom:10px}
.btn{border:1px solid #3a4452;background:#1c232c;color:#fff;border-radius:6px;padding:7px 14px;font-weight:500;transition:background .15s}
.btn:hover{background:#2a3441}
.btn.pri{background:#3fbf84;border-color:#3fbf84;color:#06261a;font-weight:600}
.btn.pri:hover{background:#5ad199}
main{max-width:1280px;margin:0 auto;padding:20px 24px 8px}
.tier{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin-bottom:8px;overflow:hidden}
.lab{width:112px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;position:relative;color:#fff}
.txt{font:700 30px/1.1 'Barlow Condensed';text-align:center;outline:0;min-width:40px;max-width:100%;overflow-wrap:anywhere;text-shadow:0 1px 2px rgba(0,0,0,.3);padding:0 4px;border-radius:4px}
.txt:focus{background:rgba(0,0,0,.22)}
.grip{position:absolute;left:6px;top:6px;cursor:grab;opacity:.7;font-size:15px;letter-spacing:-3px;user-select:none}
.del{position:absolute;right:6px;top:3px;background:none;border:0;color:#fff;font-size:20px;opacity:.7;padding:0 4px}
.del:hover{opacity:1}
.sw{width:26px;height:16px;border:2px solid rgba(255,255,255,.8);border-radius:4px;padding:0;background:none;cursor:pointer}
.sw::-webkit-color-swatch-wrapper{padding:0}.sw::-webkit-color-swatch{border:0;border-radius:2px}
.zone,.pool{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.zone{flex:1;padding:8px;min-height:calc(var(--ch) + 16px)}
.add{width:100%;border:1.5px dashed #aab2bc;background:none;border-radius:8px;padding:12px;color:var(--mute);font-weight:500}
.add:hover{border-color:var(--turf);color:var(--turf)}
.poolwrap{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(18,23,29,.08);margin-top:16px;max-height:40vh;overflow:auto;padding:10px 24px 14px;z-index:5}
.poolwrap h2{font:600 20px 'Barlow Condensed';margin:0 0 8px;display:flex;gap:10px;align-items:baseline}
.poolwrap h2 span{font:400 13px Barlow;color:var(--mute)}
.pool{min-height:var(--ch);max-width:1232px;margin:0 auto}
.card{width:var(--cw);height:var(--ch);perspective:800px;cursor:grab;flex:none;user-select:none;-webkit-user-select:none}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .8s cubic-bezier(.25,1.45,.45,1)}
.is-hidden .flip{transform:rotateY(180deg)}
.is-hidden{cursor:pointer}
.face{position:absolute;inset:0;border-radius:8px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 1px 3px rgba(18,23,29,.3)}
.front{background:#cfd5db}
.front::before{content:attr(data-i);position:absolute;inset:0 0 40% 0;display:grid;place-items:center;font:700 44px 'Barlow Condensed';color:#9aa4b0}
.front img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 8%}
.ov{position:absolute;left:0;right:0;bottom:0;padding:34px 8px 7px;background:linear-gradient(transparent,rgba(10,13,17,.92) 58%);color:#fff}
.nm{font:700 16px/1.05 'Barlow Condensed';display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm{font-size:11px;color:#b6bfca;display:block;margin-bottom:4px}
.st{display:flex;gap:0;border-top:1px solid rgba(255,255,255,.2);padding-top:4px}
.st div{flex:1;text-align:center}
.st b{display:block;font:600 15px/1 'Barlow Condensed'}
.st i{font-style:normal;font-size:9px;color:#9aa4b0}
.back{transform:rotateY(180deg);background:repeating-linear-gradient(90deg,var(--turf) 0 14px,var(--turf2) 14px 28px);display:grid;place-items:center;border:3px solid #fff;color:#fff;font:700 42px 'Barlow Condensed'}
.back::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(255,255,255,.55)}
.back span{background:var(--turf);padding:0 10px;border-radius:6px;z-index:1}
.ghost{opacity:.3}
.sortable-fallback{opacity:.95!important;filter:drop-shadow(0 12px 14px rgba(0,0,0,.35));z-index:99}
.msg{text-align:center;padding:80px 0;color:var(--mute)}
@media(max-width:899px){.poolwrap{position:static;max-height:none}.lab{width:84px}}
@media(prefers-reduced-motion:reduce){.flip{transition-duration:.01s}}
:focus-visible{outline:2px solid #3fbf84;outline-offset:2px}
</style>
</head>
<body>
<header>
  <div class="brand">Tier Sheet<small id="sub">Fantasy football rankings, PPR</small></div>
  <nav id="tabs">
    <button data-p="QB" class="on">QB</button><button data-p="RB">RB</button><button data-p="WR">WR</button><button data-p="TE">TE</button>
  </nav>
  <div class="acts">
    <button class="btn" id="reset">Reset tab</button>
    <button class="btn pri" id="hide">Hide players</button>
  </div>
</header>
<main><div id="tiers"></div><button class="add" id="add">Add tier</button></main>
<div class="poolwrap"><h2>Unranked <span id="count"></span></h2><div class="pool" id="pool"></div></div>
<div class="msg" id="msg">Loading player data...</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
// ---- Settings you can change ----
const SEASON = 2026;                          // falls back to the previous season if no games are in yet
const COUNTS = {QB:25, RB:50, WR:50, TE:25};  // players shown per position
const DEFAULT_TIERS = ['S','A','B','C','D'];
const COLORS = ['#d9534a','#ec8f3e','#e2bf3d','#7fb35f','#3f9f8f','#4a86c5','#7b72be','#c4659a','#7d8590'];
// ---------------------------------
const $ = s => document.querySelector(s);
const tiersEl = $('#tiers'), poolEl = $('#pool'), hideBtn = $('#hide');
const uid = () => Math.random().toString(36).slice(2, 8);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const f1 = n => n.toFixed(1);
let DATA, pos = 'QB', state, hideMode = false, season = SEASON;
const revealed = new Set();

async function getStats(yr, p) {
  for (const host of ['api.sleeper.com', 'api.sleeper.app']) {
    try {
      const r = await fetch(`https://${host}/stats/nfl/${yr}?season_type=regular&position[]=${p}&order_by=pts_ppr`);
      if (r.ok) { const j = await r.json(); if (Array.isArray(j)) return j; }
    } catch (e) {}
  }
  throw new Error('Could not reach the stats service');
}
const gp = s => s.gp || s.gms_active || 0;
let PLAYERS;
async function getJSON(u) { const r = await fetch(u); if (!r.ok) throw new Error(r.status + ' ' + u); return r.json(); }
async function getAll(yr) {
  PLAYERS = PLAYERS || await getJSON('https://api.sleeper.app/v1/players/nfl');
  const stats = await getJSON(`https://api.sleeper.app/v1/stats/nfl/regular/${yr}`);
  const raw = { QB: [], RB: [], WR: [], TE: [] };
  for (const id in stats) { const pl = PLAYERS[id]; if (pl && raw[pl.position]) raw[pl.position].push({ player_id: id, team: pl.team, player: pl, stats: stats[id] }); }
  return ['QB','RB','WR','TE'].map(p => raw[p]);
}
async function getRaw(yr) {
  try { return await getAll(yr); }
  catch (e) { console.warn(e); return Promise.all(['QB','RB','WR','TE'].map(p => getStats(yr, p))); }
}

async function loadData() {
  const c = JSON.parse(localStorage.getItem('ts:data') || 'null');
  if (c && Date.now() - c.t < 6 * 36e5) { season = c.season; return c.d; }
  let raw;
  for (let k = 0; k < 2; k++) {
    raw = await getRaw(season);
    if (raw[0].filter(x => x.stats && gp(x.stats) > 0).length >= 10) break;
    season--;
  }
  const team = new Map();
  raw.slice(1).flat().forEach(x => { const t = x.team; if (t && x.stats) team.set(t, (team.get(t) || 0) + (x.stats.rec_tgt || 0)); });
  const d = {};
  ['QB','RB','WR','TE'].forEach((p, i) => {
    d[p] = raw[i].filter(x => x.player && x.stats && gp(x.stats) > 0 && x.stats.pts_ppr > 0)
      .sort((a, b) => b.stats.pts_ppr - a.stats.pts_ppr).slice(0, COUNTS[p])
      .map(x => { const s = x.stats, g = gp(s), t = x.team || x.player.team || 'FA';
        return { id: String(x.player_id), name: `${x.player.first_name} ${x.player.last_name}`, team: t, pos: p,
          ppg: s.pts_ppr / g, ypc: s.rush_att ? s.rush_yd / s.rush_att : 0, tpg: (s.rec_tgt || 0) / g,
          ts: (s.rec_tgt || 0) / (team.get(t) || 1), td: s.pass_td || 0, int: s.pass_int || 0 }; });
  });
  localStorage.setItem('ts:data', JSON.stringify({ t: Date.now(), season, d }));
  return d;
}

function chips(p) {
  const m = { QB: [['PPG', f1(p.ppg)], ['TD:INT', p.int ? f1(p.td / p.int) : p.td + ':0']],
    RB: [['PPG', f1(p.ppg)], ['YPC', f1(p.ypc)], ['TGT/G', f1(p.tpg)]],
    WR: [['PPG', f1(p.ppg)], ['TGT share', Math.round(p.ts * 100) + '%']] };
  m.TE = m.WR;
  return m[p.pos].map(([l, v]) => `<div><b>${v}</b><i>${l}</i></div>`).join('');
}
function card(p) {
  const ini = p.name.split(' ').map(w => w[0]).join('').slice(0, 2);
  const h = hideMode && !revealed.has(p.id) ? ' is-hidden' : '';
  return `<div class="card${h}" data-id="${p.id}"><div class="flip">
    <div class="face front" data-i="${esc(ini)}"><img loading="lazy" alt="" src="https://sleepercdn.com/content/nfl/players/${p.id}.jpg" onerror="this.remove()">
    <div class="ov"><span class="nm">${esc(p.name)}</span><span class="tm">${esc(p.team)}</span><div class="st">${chips(p)}</div></div></div>
    <div class="face back"><span>${p.pos}</span></div></div></div>`;
}

const key = () => 'ts:' + pos;
function loadState() {
  let s = JSON.parse(localStorage.getItem(key()) || 'null');
  const ok = new Set(DATA[pos].map(p => p.id));
  if (!s) s = { tiers: DEFAULT_TIERS.map((l, i) => ({ id: uid(), label: l, color: COLORS[i], ids: [] })) };
  s.tiers.forEach(t => t.ids = t.ids.filter(i => ok.has(i)));
  return s;
}
const save = () => localStorage.setItem(key(), JSON.stringify(state));

function render() {
  const by = Object.fromEntries(DATA[pos].map(p => [p.id, p]));
  const placed = new Set(state.tiers.flatMap(t => t.ids));
  tiersEl.innerHTML = state.tiers.map(t => `<section class="tier" data-id="${t.id}">
    <div class="lab" style="background:${t.color}"><span class="grip" title="Drag to reorder">&#8942;&#8942;</span>
    <button class="del" title="Delete tier">&times;</button>
    <div class="txt" contenteditable="plaintext-only" spellcheck="false">${esc(t.label)}</div>
    <input type="color" class="sw" value="${t.color}" title="Tier color"></div>
    <div class="zone">${t.ids.filter(i => by[i]).map(i => card(by[i])).join('')}</div></section>`).join('');
  poolEl.innerHTML = DATA[pos].filter(p => !placed.has(p.id)).map(card).join('');
  const opts = { group: 'p', animation: 200, forceFallback: true, fallbackOnBody: true, fallbackTolerance: 4,
    delay: 120, delayOnTouchOnly: true, ghostClass: 'ghost', onEnd: sync };
  document.querySelectorAll('.zone').forEach(z => new Sortable(z, opts));
  new Sortable(poolEl, opts);
  count();
}
const count = () => $('#count').textContent = `${poolEl.children.length} left to place`;

function sync() {
  const old = Object.fromEntries(state.tiers.map(t => [t.id, t]));
  state.tiers = [...tiersEl.children].map(el => ({ ...old[el.dataset.id],
    ids: [...el.querySelectorAll('.card')].map(c => c.dataset.id) }));
  save(); count();
}
new Sortable(tiersEl, { handle: '.grip', animation: 200, onEnd: sync });

tiersEl.addEventListener('input', e => {
  const el = e.target.closest('.tier'); if (!el) return;
  const t = state.tiers.find(t => t.id === el.dataset.id);
  if (e.target.matches('.sw')) { t.color = e.target.value; el.querySelector('.lab').style.background = t.color; }
  else t.label = e.target.textContent;
  save();
});
tiersEl.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.matches('.txt')) { e.preventDefault(); e.target.blur(); } });
tiersEl.addEventListener('click', e => {
  if (!e.target.matches('.del')) return;
  state.tiers = state.tiers.filter(t => t.id !== e.target.closest('.tier').dataset.id);
  save(); render();
});
$('#add').onclick = () => {
  state.tiers.push({ id: uid(), label: 'New', color: COLORS[state.tiers.length % COLORS.length], ids: [] });
  save(); render();
  const t = [...document.querySelectorAll('.txt')].pop(); t.scrollIntoView({ block: 'center' });
};
$('#reset').onclick = () => {
  if (!confirm(`Reset the ${pos} tier list? All placements and tiers go back to default.`)) return;
  localStorage.removeItem(key()); state = loadState(); render();
};
$('#tabs').onclick = e => {
  const b = e.target.closest('button'); if (!b || !DATA) return;
  document.querySelectorAll('#tabs button').forEach(x => x.classList.toggle('on', x === b));
  pos = b.dataset.p; state = loadState(); render();
};

// Hide / reveal
hideBtn.onclick = () => {
  hideMode = !hideMode; revealed.clear();
  hideBtn.textContent = hideMode ? 'Reveal all' : 'Hide players';
  document.querySelectorAll('.card').forEach((c, i) => setTimeout(() => c.classList.toggle('is-hidden', hideMode), i * 16));
};
document.addEventListener('click', e => {
  const c = e.target.closest('.card.is-hidden'); if (!c) return;
  revealed.add(c.dataset.id); c.classList.remove('is-hidden');
});

(async function init() {
  try {
    DATA = await loadData();
    $('#sub').textContent = `${season} season, PPR. Stats via Sleeper`;
    $('#msg').remove(); state = loadState(); render();
  } catch (err) {
    console.error(err);
    $('#msg').innerHTML = `Couldn't load player data.<br><small>${esc(err.message)}</small><br><br><button class="btn pri" onclick="location.reload()">Try again</button>`;
  }
})();
</script>
</body>
</html>
